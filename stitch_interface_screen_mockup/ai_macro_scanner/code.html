</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">bolt</span>
</button>
<button aria-label="Close" class="text-on-surface hover:text-primary-fixed transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
</header>

s-center gap-3"><span class="bg-primary-fixed text-on-primary-fixed px-2 py-0.5 rounded font-bold text-[12px]"><span class="material-symbols-outlined text-[14px]">rice_bowl</span></span><span class="font-body-md text-primary">Jasmine Rice • 180g <span class="text-primary-fixed font-bold">(52g Carbs)</span></span></div><div class="h-px bg-outline-variant/30"></div><div class="flex items-center gap-3"><span class="bg-primary-fixed text-on-primary-fixed px-2 py-0.5 rounded font-bold text-[12px]"><span class="material-symbols-outlined text-[14px]">nutrition</span></span><span class="font-body-md text-primary">Broccoli • 85g</span></div></div></div></div>
